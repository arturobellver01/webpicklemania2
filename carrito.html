<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Montserrat', 'sans-serif']
          },
          colors: {
            brand: {
              black: '#0f1112',
              gray: '#6a716d',
              light: '#f3f4f2'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css">
  <title>Carrito | Picklemania</title>
  <meta name="description" content="Revisa tu selección y prepara tu compra en Picklemania de forma simple y segura.">
  <link rel="canonical" href="https://picklemaniaweb.es/carrito">
  <meta property="og:title" content="Carrito | Picklemania">
  <meta property="og:description" content="Revisa tu selección y prepara tu compra en Picklemania de forma simple y segura.">
  <meta property="og:image" content="https://picklemaniaweb.es/img/og-cover.jpg">
  <meta property="og:url" content="https://picklemaniaweb.es/carrito">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Carrito | Picklemania">
  <meta name="twitter:description" content="Revisa tu selección y prepara tu compra en Picklemania de forma simple y segura.">
  <meta name="twitter:image" content="https://picklemaniaweb.es/img/og-cover.jpg">
  <link rel="icon" href="/favicon.ico">
</head>
<body class="antialiased text-brand-black">
  <header></header>

  <main class="py-14 md:py-20">
    <section class="container mx-auto px-4 max-w-5xl">
      <p class="eyebrow mb-2">Tienda Picklemania</p>
      <h1 class="text-4xl md:text-5xl font-display font-black mb-8">Tu carrito</h1>

      <div id="empty-cart" class="card-soft p-8 hidden">
        <p class="text-brand-gray mb-6">Tu carrito está vacío.</p>
        <a href="coleccion" class="btn-primary inline-flex">Volver a la tienda</a>
      </div>

      <div id="cart-content" class="space-y-6">
        <div id="cart-items" class="space-y-4"></div>

        <div class="card-soft p-6 md:p-8 space-y-5">
          <h2 class="font-display font-bold text-2xl">Dirección de envío</h2>
          <div class="grid md:grid-cols-2 gap-4">
            <label class="text-sm text-brand-gray">País
              <select id="customer-country" class="mt-1 rounded-xl border border-black/15 px-4 py-2 w-full" required>
                <option value="ES">España</option>
                <option value="FR">Francia</option><option value="IT">Italia</option><option value="DE">Alemania</option>
                <option value="PT">Portugal</option><option value="BE">Bélgica</option><option value="NL">Países Bajos</option>
                <option value="AT">Austria</option><option value="PL">Polonia</option><option value="CZ">Chequia</option>
                <option value="BG">Bulgaria</option><option value="GR">Grecia</option><option value="RO">Rumanía</option>
                <option value="SE">Suecia</option><option value="DK">Dinamarca</option><option value="FI">Finlandia</option>
              </select>
            </label>
            <label class="text-sm text-brand-gray">Nombre completo
              <input id="customer-name" class="mt-1 rounded-xl border border-black/15 px-4 py-2 w-full" required>
            </label>
            <label class="text-sm text-brand-gray md:col-span-2">Dirección
              <input id="customer-address" class="mt-1 rounded-xl border border-black/15 px-4 py-2 w-full" required>
            </label>
            <label class="text-sm text-brand-gray">Código postal
              <input id="customer-postal" class="mt-1 rounded-xl border border-black/15 px-4 py-2 w-full" required>
            </label>
            <label class="text-sm text-brand-gray">Ciudad
              <input id="customer-city" class="mt-1 rounded-xl border border-black/15 px-4 py-2 w-full" required>
            </label>
            <label class="text-sm text-brand-gray">Provincia / región
              <input id="customer-state" class="mt-1 rounded-xl border border-black/15 px-4 py-2 w-full" required>
            </label>
            <label class="text-sm text-brand-gray">Teléfono
              <input id="customer-phone" class="mt-1 rounded-xl border border-black/15 px-4 py-2 w-full" required>
            </label>
            <label class="text-sm text-brand-gray md:col-span-2">Email
              <input id="customer-email" type="email" class="mt-1 rounded-xl border border-black/15 px-4 py-2 w-full" required>
            </label>
          </div>
        </div>

        <div class="card-soft p-6 md:p-8">
          <div class="space-y-2 mb-4">
            <div class="flex items-center justify-between"><p class="text-brand-gray">Subtotal productos</p><p id="cart-subtotal" class="font-semibold">0€</p></div>
            <div class="flex items-center justify-between"><p class="text-brand-gray">Envío calculado</p><p id="cart-shipping" class="font-semibold">0€</p></div>
            <div class="flex items-center justify-between text-xl"><p class="font-display font-bold">Total final</p><p id="cart-total" class="text-2xl font-display font-black">0€</p></div>
          </div>
          <p id="shipping-message" class="text-sm text-brand-gray"></p>
          <p id="shipping-gap" class="text-sm text-brand-gray mb-3"></p>

          <button id="checkout-btn" class="btn-primary w-full md:w-auto" disabled>Finalizar compra</button>
          <p id="checkout-status" class="text-sm text-brand-gray mt-3"></p>
        </div>
      </div>
    </section>
  </main>

  <footer></footer>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script src="js/checkout.js"></script>
  <script src="js/carrito-page.js"></script>
</body>
</html>
